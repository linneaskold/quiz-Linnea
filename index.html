<!DOCTYPE html>
<html lang="en">
<head>
    <title>Quiz</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="quiz">
        <h1>Resident evil quiz</h1>
        <div id="start">
            <div class="welcome">
                <h2>Welcome to a quiz about resident evil!!</h2>
                <p>Write your name in the box and klick start to play!</p>
            </div>
            <div class id="input">
                <input type="text" id="player-name" placeholder="Write your name here">

            </div>
            <button id ="startbutton" onclick="startQuiz()">start</button>
           
        </div>
        <div id = "quizz" style="display: none;"></div>
        <div id="results"></div>
        <div id="leaderboard" style="display: none;"></div>

    </div>
</body>
</html>
